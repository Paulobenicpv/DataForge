[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge-local"
version = "2.1.1"
description = "Preparação configurável e auditável de dados tabulares"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3.0", "openpyxl>=3.1.5,<4.0"]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1.0"]

[project.scripts]
dataforge = "dataforge.interfaces.cli:main"
dataforge-desktop = "dataforge.interfaces.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
